default: &default
  adapter: postgresql
  pool: 5
  timeout: 5000

development:
  <<: *default
  adapter: postgresql
  host: <%= ENV['DATABASE_DEV_HOST'] %>
  port: <%= ENV['DATABASE_DEV_PORT'] %>
  database: <%= ENV['DATABASE_DEV_DATABASE'] %>
  username: <%= ENV['DATABASE_DEV_USERNAME'] %>
  password: <%= ENV['DATABASE_DEV_PASSWORD'] %>

test:
  <<: *default
  adapter: postgresql
  host: <%= ENV['DATABASE_QA_HOST'] %>
  port: <%= ENV['DATABASE_QA_PORT'] %>
  database: <%= ENV['DATABASE_QA_DATABASE'] %>
  username: <%= ENV['DATABASE_QA_USERNAME'] %>
  password: <%= ENV['DATABASE_QA_PASSWORD'] %>

production:
  <<: *default
  adapter: postgresql
  host: <%= ENV['DATABASE_PROD_HOST'] %>
  port: <%= ENV['DATABASE_PROD_PORT'] %>
  database: <%= ENV['DATABASE_PROD_DATABASE'] %>
  username: <%= ENV['DATABASE_PROD_USERNAME'] %>
  password: <%= ENV['DATABASE_PROD_PASSWORD'] %>